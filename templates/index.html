<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniLLM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/><path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>OmniLLM</span>
      </div>
      <button class="icon-btn" onclick="newChat()" title="New chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
    <div class="sidebar-chats" id="chatList"></div>
    <div class="sidebar-footer">
      <button class="sidebar-btn" onclick="openSettings()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 00-2 2v.18a2 2 0 01-1 1.73l-.43.25a2 2 0 01-2 0l-.15-.08a2 2 0 00-2.73.73l-.22.38a2 2 0 00.73 2.73l.15.1a2 2 0 011 1.72v.51a2 2 0 01-1 1.74l-.15.09a2 2 0 00-.73 2.73l.22.38a2 2 0 002.73.73l.15-.08a2 2 0 012 0l.43.25a2 2 0 011 1.73V20a2 2 0 002 2h.44a2 2 0 002-2v-.18a2 2 0 011-1.73l.43-.25a2 2 0 012 0l.15.08a2 2 0 002.73-.73l.22-.39a2 2 0 00-.73-2.73l-.15-.08a2 2 0 01-1-1.74v-.5a2 2 0 011-1.74l.15-.09a2 2 0 00.73-2.73l-.22-.38a2 2 0 00-2.73-.73l-.15.08a2 2 0 01-2 0l-.43-.25a2 2 0 01-1-1.73V4a2 2 0 00-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        API Keys
      </button>
      <button class="sidebar-btn" onclick="openTerminal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        Code Terminal
      </button>
    </div>
  </aside>

  <main id="main">
    <header id="chatHeader">
      <button class="icon-btn mobile-menu" onclick="toggleSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="provider-selector">
        <select id="providerSelect" onchange="onProviderChange()"></select>
        <select id="modelSelect"></select>
      </div>
      <div class="header-status" id="headerStatus"></div>
    </header>

    <div id="chatMessages" class="chat-messages"></div>
    <div id="filePreviewBar" class="file-preview-bar hidden"></div>

    <div class="input-area">
      <div class="input-row">
        <label class="upload-btn" title="Attach file">
          <input type="file" id="fileInput" multiple onchange="handleFiles(this.files)" hidden
                 accept="image/*,video/*,.pdf,.txt,.py,.js,.json,.csv,.md,.html,.css,.zip">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
        </label>
        <textarea id="messageInput" placeholder="Type a message..." rows="1"
                  onkeydown="handleInputKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-backdrop" onclick="closeSettings()"></div>
  <div class="modal-content">
    <div class="modal-header">
      <h3>API Keys</h3>
      <button class="icon-btn" onclick="closeSettings()">&times;</button>
    </div>
    <div class="modal-body" id="settingsBody"></div>
    <div class="modal-footer">
      <button class="btn-primary" onclick="saveKeys()">Save keys</button>
    </div>
  </div>
</div>

<!-- Terminal Modal -->
<div id="terminalModal" class="modal hidden">
  <div class="modal-backdrop" onclick="closeTerminal()"></div>
  <div class="modal-content modal-wide">
    <div class="modal-header">
      <h3>Python Terminal</h3>
      <button class="icon-btn" onclick="closeTerminal()">&times;</button>
    </div>
    <div class="modal-body terminal-body">
      <div class="terminal-editor">
        <div class="terminal-toolbar">
          <span class="terminal-label">editor</span>
          <button class="btn-run" onclick="runCode()">▶ Run</button>
        </div>
        <textarea id="codeEditor" spellcheck="false">import requests, json

# Paste your API key here
API_KEY = "your-api-key-here"

# ---- Claude example ----
response = requests.post("https://api.anthropic.com/v1/messages",
    headers={"x-api-key": API_KEY, "anthropic-version": "2023-06-01", "Content-Type": "application/json"},
    json={"model": "claude-sonnet-4-20250514", "max_tokens": 1024,
          "messages": [{"role": "user", "content": "Hello!"}]})

# ---- ChatGPT example (uncomment to use) ----
# response = requests.post("https://api.openai.com/v1/chat/completions",
#     headers={"Authorization": f"Bearer {API_KEY}", "Content-Type": "application/json"},
#     json={"model": "gpt-4o", "messages": [{"role": "user", "content": "Hello!"}], "max_tokens": 1024})

print(json.dumps(response.json(), indent=2))</textarea>
      </div>
      <div class="terminal-output">
        <div class="terminal-toolbar">
          <span class="terminal-label">output</span>
          <button class="btn-clear" onclick="clearOutput()">Clear</button>
        </div>
        <pre id="codeOutput">Ready to run...</pre>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
